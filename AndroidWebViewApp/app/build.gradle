plugins {
    id "com.android.application"
}

def signingPropertiesFile = rootProject.file("signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def releaseSigningReady = signingPropertiesFile.exists()
        && signingProperties["storeFile"]
        && signingProperties["storePassword"]
        && signingProperties["keyAlias"]
        && signingProperties["keyPassword"]

android {
    namespace = "com.colorvision.xcviewer"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.colorvision.xcviewer"
        minSdk 23
        targetSdk 36
        versionCode 101
        versionName "2.90"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile rootProject.file(signingProperties["storeFile"])
                storePassword signingProperties["storePassword"]
                keyAlias signingProperties["keyAlias"]
                keyPassword signingProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def cameraXVersion = "1.5.3"
    implementation "androidx.camera:camera-core:$cameraXVersion"
    implementation "androidx.camera:camera-camera2:$cameraXVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraXVersion"
    implementation "androidx.camera:camera-view:$cameraXVersion"
    implementation "com.google.zxing:core:3.5.3"
    implementation "androidx.core:core:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "com.google.android.material:material:1.13.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase(Locale.ROOT).contains("release") } && !releaseSigningReady) {
        throw new GradleException("Release signing is not configured. Run AndroidWebViewApp/build-release.ps1 once to create local signing.properties and .signing/colorvision-release.jks.")
    }
}
